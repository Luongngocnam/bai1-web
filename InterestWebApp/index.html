<!DOCTYPE html>
<html>
<head>
    <title>Tính Lãi Suất Kép</title>
    <style>
        body {
            font-family: Arial;
        }

        #form {
            margin: 20px;
        }

        #result {
            color: green;
        }
    </style>
</head>
<body>
    <h1>Tính lãi suất kép của Lương Ngọc Nam</h1>
    <div id="form">
        Tiền gốc (VND): <input type="number" id="principal"><br>
        Lãi suất (%): <input type="number" id="rate" step="0.1"><br>
        Số năm: <input type="number" id="years"><br>
        <button onclick="calculateInterest()">Tính</button>
    </div>
    <div id="result"></div>

    <script>
        function calculateInterest() {
            var principal = document.getElementById("principal").value;
            var rate = document.getElementById("rate").value;
            var years = document.getElementById("years").value;

            var xhr = new XMLHttpRequest();

            // Mở kết nối TRƯỚC
            xhr.open("POST", "api.aspx", true);

            // Sau đó mới set Header
            xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");

            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var response = JSON.parse(xhr.responseText);
                    document.getElementById("result").innerText =
                        response.result + " (Lương Ngọc Nam)";
                }
            };

            // Gửi dữ liệu
            xhr.send("principal=" + principal + "&rate=" + rate + "&years=" + years);
        }

    </script>
</body>
</html>
